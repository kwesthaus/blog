<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Leaflet Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <link rel="stylesheet" href="https://ptma.github.io/Leaflet.Measure/src/leaflet.measure.css"/>
    <link rel="stylesheet" href="https://ptma.github.io/Leaflet.Legend/src/leaflet.legend.css"/>



    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="https://ptma.github.io/Leaflet.Measure/src/leaflet.measure.js"></script>
    <!-- <script src="https://ptma.github.io/Leaflet.Legend/src/leaflet.legend.js"></script> -->
    <script src="../shared/leaflet.legend.js"></script>

    <script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-vector@4.3.2/dist/esri-leaflet-vector.js"></script>

    <script src='//api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>

    <script src="https://unpkg.com/togeojson@0.16.0"></script>
    <script src="https://unpkg.com/leaflet-filelayer@1.2.0"></script>


    <style type="text/css">
      body{
        margin: 0;
        padding: 0;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
    </style>

  </head>
  <body>
    <div id="map"></div>
    <script>
        const map = L.map('map', {
            // washington state
            center: [47.5, -121],
            zoom: 8.5,
            // attributionControl: false,
        });

        map.on('contextmenu',(e) => {
            // 3 decimal places for latitude ~110m resolution
            // longitude resolution is dependent on latitude. at 45°, 3 decimal places is ~79m
            let lltext = `(${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`;
            L.popup()
            .setLatLng(e.latlng)
            .setContent(lltext)
            .openOn(map);
        });

        L.control.scale().addTo(map);
        L.control.measure().addTo(map);

        let legendControl = L.control.Legend({
            position: "bottomleft",
            collapsed: true,
            legends: [],
        }).addTo(map);

        let fileControl = L.Control.fileLayerLoad({
            // Allows you to use a customized version of L.geoJson.
            // For example if you are using the Proj4Leaflet leaflet plugin,
            // you can pass L.Proj.geoJson and load the files into the
            // L.Proj.GeoJson instead of the L.geoJson.
            // layer: L.geoJson,
            // See http://leafletjs.com/reference.html#geojson-options
            // layerOptions: {
            //     onEachFeature: countyEachFeature, // popup
            //     style: visitTypeStyle, // lines + polygons
            // },
            // Add to map after loading (default: true) ?
            addToMap: true,
            // File size limit in kb (default: 1024) ?
            fileSizeLimit: 1024*10,
            // Restrict accepted file formats (default: .geojson, .json, .kml, and .gpx) ?
            // formats: [
            //     '.geojson',
            // ]
        }).addTo(map);


        function jsonToTable(jdata) {
            let table = '<table><tbody>'

            let props = Object.keys(jdata);
            props.forEach(prop => {
                table += '<tr>';
                table += `<th>${prop}</th>`;
                table += `<td>${jdata[prop]}</td>`;
                table += '</tr>';
            });

            table += '</tbody></table>'; return table;
        }

        function eachFeature(feature, layer) {
            var mytable = jsonToTable(feature.properties);
            layer.bindPopup(mytable);
        }

        async function addGeojsonFileToControls(fileName, layerName, pathStyle, pointStyle, layerControl, onByDefault, legendControl) {
            let mygeo = await fetch(fileName).then(resp => resp.json());
            let mylayer = L.geoJson(mygeo, {
                onEachFeature: eachFeature, // popup
                style: pathStyle, // lines + polygons
                pointToLayer: pointStyle // points
            });

            if (layerControl) {
                layerControl.addOverlay(mylayer, layerName);
            }
            if (onByDefault) {
                mylayer.addTo(map);
            }
            if (legendControl && pathStyle) {
                let legend = {label: layerName, layers: [mylayer], type: "polygon", sides: 4, fillColor: pathStyle['fillColor'], color: pathStyle['color'], weight: pathStyle['weight'], opacity: pathStyle['opacity'], fillOpacity: pathStyle['fillOpacity']}
                legendControl.addLegend(legend);
            } 
        }

        const baseMaps = {
            StreetView: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',   {maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}),
            TopoView: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',   {maxZoom: 17, attribution: 'Kartendaten: © OpenStreetMap-Mitwirkende, SRTM | Kartendarstellung: © OpenTopoMap (CC-BY-SA)'}),
            USGS_USTopo: L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 20, attribution: 'Tiles courtesy of the <a href="https://usgs.gov/">U.S. Geological Survey</a>'}),
            USGS_USImageryTopo: L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 20, attribution: 'Tiles courtesy of the <a href="https://usgs.gov/">U.S. Geological Survey</a>'}),
            Stadia_AlidadeSatellite: L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_satellite/{z}/{x}/{y}{r}.{ext}', {minZoom: 0, maxZoom: 20, attribution: '&copy; CNES, Distribution Airbus DS, © Airbus DS, © PlanetObserver (Contains Copernicus Data) | &copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', ext: 'jpg'}),
            Esri_WorldImagery: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'}),
            Esri_WorldTopoMap: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community'}),

            // VectorTileServer
            USFS_FSTopo: L.esri.Vector.vectorTileLayer('2e1593463c30495e9c802098527e3d1b'),
            // WADNR_RAT: L.esri.Vector.vectorTileLayer('c9130b8beb7345e68eee98522e0c0acc'),
        };

        var layerControl = L.control.layers(baseMaps, undefined, {collapsed: true}).addTo(map);
        // default
        baseMaps.TopoView.addTo(map);



        //
        // lines
        //



        //
        // polygons
        //



        //
        // points
        //



    </script>
  </body>
</html>
