    <script>

        const map = L.map('map', {
            // washington state

        });

        map.on('contextmenu',(e) => {
            // 3 decimal places for latitude ~110m resolution
            // longitude resolution is dependent on latitude. at 45°, 3 decimal places is ~79m
            let lltext = `(${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`;
            L.popup()
            .setLatLng(e.latlng)
            .setContent(lltext)
            .openOn(map);
        });

        L.control.scale().addTo(map);
        L.control.measure().addTo(map);
        let filterControl = L.control.sotaFilter().addTo(map);

        let legendControl = L.control.Legend({
            position: "bottomleft",
            collapsed: true,
            legends: [],
        }).addTo(map);
        /*
        let legendControl = L.control.Legend({
            position: "bottomleft",
            collapsed: false,
            legends: [
                {label: "Wilderness", layers: [], type: "polygon", sides: 4, fillColor: "#009f00", color: "#004f00", weight: 3, opacity: 1, fillOpacity: 0.4},
            ]
        }).addTo(map);
        */




        function jsonToTable(jdata) {
            let table = '<table><tbody>'

            let props = Object.keys(jdata);
            props.forEach(prop => {
                table += '<tr>';
                table += `<th>${prop}</th>`;
                table += `<td>${jdata[prop]}</td>`;
                table += '</tr>';
            });

            table += '</tbody></table>'; return table;
        }

        function eachFeature(feature, layer) {
            var mytable = jsonToTable(feature.properties);
            layer.bindPopup(mytable);
        }

/*
            {label: "Wilderness", layers: [], type: "polygon", sides: 4, fillColor: "#009f00", color: "#004f00", weight: 3, opacity: 1, fillOpacity: 0.4},
*/

        async function addGeojsonFileToControls(fileName, layerName, pathStyle, pointStyle, layerControl, onByDefault, legendControl) {
            let mygeo = await fetch(fileName).then(resp => resp.json());
            let mylayer = L.geoJson(mygeo, {
                onEachFeature: eachFeature, // popup
                style: pathStyle, // lines + polygons
                pointToLayer: pointStyle // points
            });

            if (layerControl) {
                layerControl.addOverlay(mylayer, layerName);
            }
            if (onByDefault) {
                mylayer.addTo(map);
            }
            if (legendControl && pathStyle) {
                let legend = {label: layerName, layers: [mylayer], type: "polygon", sides: 4, fillColor: pathStyle['fillColor'], color: pathStyle['color'], weight: pathStyle['weight'], opacity: pathStyle['opacity'], fillOpacity: pathStyle['fillOpacity']}
                legendControl.addLegend(legend);
            } 
        }

        });

            // USFS_FSTopo: L.maplibreGL({style: 'https://tiles.arcgis.com/tiles/gGHDlz6USftL5Pau/arcgis/rest/services/FSBasemap_20240617/VectorTileServer'}),

        layerControl.addOverlay(dnrRoadLayer, "DNR Road");



        //
        // polygons
        //
        let wildStyle = {
            'fillColor': '#009f00',
            'color': '#004f00',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4

        addGeojsonFileToControls('../shared/uniqueID-geojson/wa-wilderness.geojson', 'wilderness', wildStyle, undefined, layerControl, true, legendControl);

        /*
        let grwBoundaryStyle = {

        addGeojsonFileToLayerControl('uniqueID-geojson/greenriver-watershed-boundary.geojson', 'gr-watershed-boundary', grwBoundaryStyle, undefined, layerControl, true);

        let wshedAreaStyle = function(feature) {
            let fc = '#000000';
            let c = '#000000';
            switch (feature.properties.access) {
                case 'knownGood':
                    fc = '#00ff00';
                    c = '#007f00';
                    break;
                case 'questionable':
                    fc = '#ffff00';
                    c = '#7f7f00';
                    break;
                case 'no':
                    fc = '#ff0000';
                    c = '#7f0000';
                    break;
            }
            return {
                'fillColor': fc,
                'color': c,
                'weight': 4,
                'opacity': 1,
                'fillOpacity': 0.4
            };
        }
        /*
        addGeojsonFileToControls('uniqueID-geojson/grw-areas.geojson', 'green-watershed-areas', wshedAreaStyle, undefined, layerControl, true, legendControl);

            'opacity': 1,

        };

        addGeojsonFileToControls('../shared/nonuniqueID-geojson/parcels/grw-access/none.geojson', 'grw-none', maybeStyle, undefined, layerControl, true, legendControl);

        badStyle = {
            'fillColor': '#ff9f00',
            'color': '#7f4f00',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4
        };
        addGeojsonFileToControls('../shared/nonuniqueID-geojson/parcels/grw-access/tribe.geojson', 'grw-tribe', badStyle, undefined, layerControl, true, legendControl);
        addGeojsonFileToControls('../shared/nonuniqueID-geojson/parcels/grw-access/indiv.geojson', 'grw-indiv', badStyle, undefined, layerControl, true, legendControl);
        addGeojsonFileToControls('../shared/nonuniqueID-geojson/parcels/grw-access/watershed.geojson', 'grw-watershed', badStyle, undefined, layerControl, true, legendControl);


        regionStyle = {
            'fillColor': '#00003f',
            'color': '#00007f',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.2
        };
        addGeojsonFileToControls('../shared/nonuniqueID-geojson/w7w-regions.geojson', 'w7w-regions', regionStyle, undefined, layerControl, true, legendControl);


        //
        // points
        //
        let parkStyle = function(feature, latlng) {
            var parkIcon = L.icon({
                iconUrl: '../shared/icons/Parking.svg',
                iconSize: [16, 16]
            });
            return L.marker(latlng, {icon: parkIcon});
        };
        addGeojsonFileToControls('../shared/uniqueID-geojson/snoparks.geojson', 'snoparks', undefined, parkStyle, layerControl, true, legendControl);

        let grGateStyle = function(feature, latlng) {
            var gateIcon = L.icon({
                iconUrl: '../shared/icons/Red_X.svg',
                iconSize: [16, 16]
            });
            return L.marker(latlng, {icon: gateIcon});
        };
        addGeojsonFileToControls('../shared/uniqueID-geojson/greenriver-watershed-gates.geojson', 'gr-watershed-gates', undefined, grGateStyle, layerControl, true, legendControl);


        map.createPane("summitMarker");
        // see https://github.com/Leaflet/Leaflet/blob/v1.0.0/dist/leaflet.css#L87 to compare values
        map.getPane("summitMarker").style.zIndex = 600;

        /*
        // sotl.as uses a tiled vector layer called "summits" that is hosted/served via maptiler
        // fields: act (num), alt (num), code (str), name (str), points (num)

        let fourStyle = function(feature, latlng) {
            var markerOptions = {
                pane: "summitMarker",
                icon: L.divIcon({
                    iconSize: L.point(14, 14),
                    html: "4",
                    className: "summitcircle points-4",
                }),
            };
            return L.marker(latlng, markerOptions);
        };
        addGeojsonFileToControls('../shared/uniqueID-geojson/W7W-4pts.geojson', 'summits-4', undefined, fourStyle, layerControl, true, legendControl);

        let sixStyle = function(feature, latlng) {
            var markerOptions = {
                pane: "summitMarker",
                icon: L.divIcon({
                    iconSize: L.point(14, 14),
                    html: "6",
                    className: "six",
                }),
            };
            return L.marker(latlng, markerOptions);
        };
        addGeojsonFileToControls('../shared/uniqueID-geojson/W7W-6pts.geojson', 'summits-6', undefined, sixStyle, layerControl, true, legendControl);
        */


        let summitStyle = function(feature, latlng) {
            let className = `summitcircle points-${feature.properties.Points}`;

            var markerOptions = {
                pane: "summitMarker",
                icon: L.divIcon({
                    iconSize: L.point(14, 14),
                    html: feature.properties.ActivationCount,
                    className: className,
                }),
            };
            return L.marker(latlng, markerOptions);
        };
        let filterFunc = filterControl._buildPresetsFilter();
        let summitLayer = L.geoJson(null, {pointToLayer: summitStyle, onEachFeature: eachFeature, filter: filterFunc});

        let hydrateFunc = function(layer) {
            console.log("hydrating");
            omnivore.csv('../shared/summitslist-CUSTOM.csv', {latfield: 'Latitude', lonfield: 'Longitude', delimiter: ','}, layer);
        }
        hydrateFunc(summitLayer);
        summitLayer.addTo(map);
        filterControl.setLayer(summitLayer, hydrateFunc);

    </script>
  </body>
