<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Leaflet Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <link rel="stylesheet" href="https://ptma.github.io/Leaflet.Measure/src/leaflet.measure.css"/>
    <link rel="stylesheet" href="https://ptma.github.io/Leaflet.Legend/src/leaflet.legend.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <script src="https://ptma.github.io/Leaflet.Measure/src/leaflet.measure.js"></script>
    <!-- <script src="https://ptma.github.io/Leaflet.Legend/src/leaflet.legend.js"></script> -->
    <script src="leaflet.legend.js"></script>

    <style type="text/css">
      body{
        margin: 0;
        padding: 0;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
    </style>

  </head>
  <body>
    <div id="map"></div>
    <!-- <script src="https://ljagis.github.io/leaflet-measure/leaflet-measure.js"></script> -->
    <script>
    // <script type="module">
        // import geojson from './testapi.geojson';

        const map = L.map('map', {
            // washington state
            center: [47.5, -121],
            zoom: 8.5
        });

        map.on('contextmenu',(e) => {
            // 3 decimal places for latitude ~110m resolution
            // longitude resolution is dependent on latitude. at 45°, 3 decimal places is ~79m
            let lltext = `(${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`;
            L.popup()
            .setLatLng(e.latlng)
            .setContent(lltext)
            .openOn(map);
        });

        L.control.scale().addTo(map);
        L.control.measure().addTo(map);

        let legendControl = L.control.Legend({
            position: "bottomleft",
            collapsed: false,
            legends: [],
        }).addTo(map);
        /*
        let legendControl = L.control.Legend({
            position: "bottomleft",
            collapsed: false,
            legends: [
                {label: "Wilderness", layers: [], type: "polygon", sides: 4, fillColor: "#009f00", color: "#004f00", weight: 3, opacity: 1, fillOpacity: 0.4},
            ]
        }).addTo(map);
        */




        function jsonToTable(jdata) {
            let table = '<table><tbody>'

            let props = Object.keys(jdata);
            props.forEach(prop => {
                table += '<tr>';
                table += `<th>${prop}</th>`;
                table += `<td>${jdata[prop]}</td>`;
                table += '</tr>';
            });

            table += '</tbody></table>'; return table;
        }

        function eachFeature(feature, layer) {
            var mytable = jsonToTable(feature.properties);
            layer.bindPopup(mytable);
        }

/*
            {label: "Wilderness", layers: [], type: "polygon", sides: 4, fillColor: "#009f00", color: "#004f00", weight: 3, opacity: 1, fillOpacity: 0.4},
*/

        async function addGeojsonFileToControls(fileName, layerName, pathStyle, pointStyle, layerControl, onByDefault, legendControl) {
            let mygeo = await fetch(fileName).then(resp => resp.json());
            let mylayer = L.geoJson(mygeo, {
                onEachFeature: eachFeature, // popup
                style: pathStyle, // lines + polygons
                pointToLayer: pointStyle // points
            });

            if (layerControl) {
                layerControl.addOverlay(mylayer, layerName);
            }
            if (onByDefault) {
                mylayer.addTo(map);
            }
            if (legendControl && pathStyle) {
                let legend = {label: layerName, layers: [mylayer], type: "polygon", sides: 4, fillColor: pathStyle['fillColor'], color: pathStyle['color'], weight: pathStyle['weight'], opacity: pathStyle['opacity'], fillOpacity: pathStyle['fillOpacity']}
                legendControl.addLegend(legend);
            } 
        }






        const baseMaps = {
            StreetView: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',   {attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}),
            TopoView: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',   {attribution: 'Kartendaten: © OpenStreetMap-Mitwirkende, SRTM | Kartendarstellung: © OpenTopoMap (CC-BY-SA)'}),
            USGS_USTopo: L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {maxZoom: 20, attribution: 'Tiles courtesy of the <a href="https://usgs.gov/">U.S. Geological Survey</a>'})
        };

        var layerControl = L.control.layers(baseMaps, undefined, {collapsed: false}).addTo(map);
        // default
        baseMaps.TopoView.addTo(map);



        //
        // lines
        //
        let motorStyle = {
            'color': '#ff0000',
            'weight': 4
        };
        addGeojsonFileToControls('uniqueID-geojson/motorized.geojson', 'motorized', motorStyle, undefined, layerControl, true, legendControl);

        let nonmotorStyle = {
            'color': '#0000ff',
            'weight': 4
        };
        addGeojsonFileToControls('uniqueID-geojson/nonmotorized.geojson', 'nonmotorized', nonmotorStyle, undefined, layerControl, true, legendControl);



        //
        // polygons
        //
        let wildStyle = {
            'fillColor': '#009f00',
            'color': '#004f00',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4
        };
        addGeojsonFileToControls('uniqueID-geojson/wa-wilderness.geojson', 'wilderness', wildStyle, undefined, layerControl, true, legendControl);

        /*
        let grwBoundaryStyle = {
            'fillColor': '#ff0000',
            'color': '#7f0000',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4
        };
        addGeojsonFileToLayerControl('uniqueID-geojson/greenriver-watershed-boundary.geojson', 'gr-watershed-boundary', grwBoundaryStyle, undefined, layerControl, true);
        */

        let wshedAreaStyle = function(feature) {
            let fc = '#000000';
            let c = '#000000';
            switch (feature.properties.access) {
                case 'knownGood':
                    fc = '#00ff00';
                    c = '#007f00';
                    break;
                case 'questionable':
                    fc = '#ffff00';
                    c = '#7f7f00';
                    break;
                case 'no':
                    fc = '#ff0000';
                    c = '#7f0000';
                    break;
            }
            return {
                'fillColor': fc,
                'color': c,
                'weight': 4,
                'opacity': 1,
                'fillOpacity': 0.4
            };
        }
        /*
        addGeojsonFileToControls('uniqueID-geojson/grw-areas.geojson', 'green-watershed-areas', wshedAreaStyle, undefined, layerControl, true, legendControl);
        */

        let crwStyle = {
            'fillColor': '#ff0000',
            'color': '#7f0000',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4
        };
        // https://www.openstreetmap.org/way/577601007
        addGeojsonFileToControls('uniqueID-geojson/crw-area.geojson', 'cedar-watershed-areas', crwStyle, undefined, layerControl, true, legendControl);

        goodStyle = {
            'fillColor': '#00ff00',
            'color': '#007f00',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4
        };
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/federal.geojson', 'grw-federal', goodStyle, undefined, layerControl, true, legendControl);
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/state.geojson', 'grw-state', goodStyle, undefined, layerControl, true, legendControl);
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/local.geojson', 'grw-local', goodStyle, undefined, layerControl, true, legendControl);

        maybeStyle = {
            'fillColor': '#ffff00',
            'color': '#7f7f00',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4
        };
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/corp.geojson', 'grw-corp', maybeStyle, undefined, layerControl, true, legendControl);
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/none.geojson', 'grw-none', maybeStyle, undefined, layerControl, true, legendControl);

        badStyle = {
            'fillColor': '#ff9f00',
            'color': '#7f4f00',
            'weight': 4,
            'opacity': 1,
            'fillOpacity': 0.4
        };
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/tribe.geojson', 'grw-tribe', badStyle, undefined, layerControl, true, legendControl);
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/indiv.geojson', 'grw-indiv', badStyle, undefined, layerControl, true, legendControl);
        addGeojsonFileToControls('nonuniqueID-geojson/parcels/grw-access/watershed.geojson', 'grw-watershed', badStyle, undefined, layerControl, true, legendControl);


        //
        // points
        //
        let parkStyle = function(feature, latlng) {
            var parkIcon = L.icon({
                iconUrl: 'icons/Parking.svg',
                iconSize: [16, 16]
            });
            return L.marker(latlng, {icon: parkIcon});
        };
        addGeojsonFileToControls('uniqueID-geojson/snoparks.geojson', 'snoparks', undefined, parkStyle, layerControl, true, legendControl);

        let grGateStyle = function(feature, latlng) {
            var gateIcon = L.icon({
                iconUrl: 'icons/Red_X.svg',
                iconSize: [16, 16]
            });
            return L.marker(latlng, {icon: gateIcon});
        };
        addGeojsonFileToControls('uniqueID-geojson/greenriver-watershed-gates.geojson', 'gr-watershed-gates', undefined, grGateStyle, layerControl, true, legendControl);


        map.createPane("summitMarker");
        // see https://github.com/Leaflet/Leaflet/blob/v1.0.0/dist/leaflet.css#L87 to compare values
        map.getPane("summitMarker").style.zIndex = 600;

        let fourStyle = function(feature, latlng) {
            var circleOptions = {
                pane: "summitMarker",
                radius: 6,
                fillColor: '#aea727',
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 1
            };
            return L.circleMarker(latlng, circleOptions);
        };
        addGeojsonFileToControls('uniqueID-geojson/W7W-4pts.geojson', 'summits-4', undefined, fourStyle, layerControl, true, legendControl);

        let sixStyle = function(feature, latlng) {
            var circleOptions = {
                pane: "summitMarker",
                radius: 6,
                fillColor: '#efa818',
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 1
            };
            return L.circleMarker(latlng, circleOptions);
        };
        addGeojsonFileToControls('uniqueID-geojson/W7W-6pts.geojson', 'summits-6', undefined, sixStyle, layerControl, true, legendControl);

    </script>
  </body>
</html>
